[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "apply_seg_onnx"
dynamic = ["version"]
description = "ONNX Runtime inference of 3D MRI segmentation models (MINC/NIfTI) without PyTorch"
readme = "README.md"
requires-python = ">=3.9"
authors = [{ name = "Vladimir S. Fonov", email = "v.s.fonov@ilmarin.info" }]
dependencies = [
    "minc2_simple",
    "numpy",
    "scipy",
    "onnx",
    # ONNX Runtime >= 1.18 (CUDA option use_tf32) is required but not listed here: it is distributed as
    # onnxruntime (CPU) or onnxruntime-gpu, which provide the same module and must not be installed together.
    # Choose with the extras below; conda-forge's onnxruntime (also its CUDA builds) works as is.
]

[project.optional-dependencies]
cpu = ["onnxruntime>=1.18"]
gpu = ["onnxruntime-gpu>=1.18"]
nifti = ["nibabel"]                    # .nii.gz I/O and the "reorient" config key (MindGlide pipeline)
progress = ["tqdm"]                    # --progress
all = ["nibabel", "tqdm"]

[project.scripts]
apply_seg_onnx = "apply_seg_onnx.inference:main"

[tool.setuptools]
packages = ["apply_seg_onnx"]

[tool.setuptools.dynamic]
version = { attr = "apply_seg_onnx.__version__" }

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "gpu: needs onnxruntime CUDAExecutionProvider and a GPU (skipped otherwise)",
    "reference: cross-checks against MONAI (skipped if monai is not installed)",
]
